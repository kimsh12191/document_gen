# 쪽 단위 + 앞 쪽 상태 SFT (training/train.py sft --config 로 실행). 2부 은행 업무 모델(병합 폴더)에서 출발.
# 문항 하나 = 쪽 이미지 1장(최대 3600토큰) + 질문·상태(최대 약 700토큰) + 답(최대 약 2600토큰, 생성 데이터 실측).
# A100 80GB 2장 기준: GPU당 2문항 x 2장 x 누적 4 = 업데이트당 16문항.
model_type: qwen3_5
tuner_type: lora
torch_dtype: bfloat16
target_modules: all-linear
freeze_llm: false
freeze_vit: false
freeze_aligner: false
lora_rank: 32
lora_alpha: 64
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: true
num_train_epochs: 1
max_length: 8192
warmup_ratio: 0.05
logging_steps: 1
save_steps: 200
save_total_limit: 3
dataloader_num_workers: 4
dataset_num_proc: 4
split_dataset_ratio: 0
report_to: none
deepspeed: zero2
learning_rate: 1.0e-4
add_non_thinking_prefix: true
loss_scale: ignore_empty_think
