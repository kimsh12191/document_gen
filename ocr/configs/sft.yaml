# Native MS-SWIFT 4.x options. Paths and GPU IDs are launcher arguments.
# Batch layout for 2 x A100 80GB: 2 packed samples per GPU x 2 GPUs x 2 accumulation = 8 per update
# (each packed sample is one image with up to 8 questions).
# If it runs out of memory: per_device_train_batch_size 1, gradient_accumulation_steps 4 (same 8).
model_type: qwen3_5
tuner_type: lora
torch_dtype: bfloat16
target_modules: all-linear
freeze_llm: false
freeze_vit: false
freeze_aligner: false
lora_rank: 32
lora_alpha: 64
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
gradient_checkpointing: true
num_train_epochs: 1
# Packed multi-turn samples: ~3600 image tokens + up to 4000 chars of Q/A text.
max_length: 10240
warmup_ratio: 0.05
logging_steps: 1
save_steps: 100
save_total_limit: 3
dataloader_num_workers: 4
dataset_num_proc: 4
split_dataset_ratio: 0
report_to: none
deepspeed: zero2
learning_rate: 1.0e-4
# Optional, check the option names against the installed ms-swift before enabling:
# vit_lr: 2.0e-5
# aligner_lr: 5.0e-5
# attn_impl: flash_attn
eval_steps: 100
per_device_eval_batch_size: 1
add_non_thinking_prefix: true
loss_scale: ignore_empty_think
