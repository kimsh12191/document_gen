# Native MS-SWIFT 4.x options. Paths and GPU IDs are launcher arguments.
model_type: qwen3_5
tuner_type: lora
torch_dtype: bfloat16
target_modules: all-linear
freeze_llm: false
freeze_vit: false
freeze_aligner: false
lora_rank: 16
lora_alpha: 32
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
num_train_epochs: 1
max_length: 4096
warmup_ratio: 0.05
logging_steps: 1
save_steps: 100
save_total_limit: 3
dataloader_num_workers: 2
dataset_num_proc: 4
split_dataset_ratio: 0
report_to: none
deepspeed: zero2
learning_rate: 5.0e-5
eval_steps: 100
per_device_eval_batch_size: 1
add_non_thinking_prefix: true
loss_scale: ignore_empty_think
