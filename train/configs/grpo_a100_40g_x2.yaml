# GRPO for 2 x A100 40GB: 1 completion per GPU step x 2 GPUs x 8 accumulation = 16 completions
# = 4 prompts x num_generations 4 per optimizer step (same step count as the 80GB file, 4 answers per prompt
# instead of 8). The vision encoder stays frozen (as in sft_a100_40g_x2.yaml) to save activation memory.
# Still out of memory: grpo.max_images 2 in the pipeline config (shorter prompts), then --from select.
# Keep zero2 (zero3 makes generation many times slower).
# Reward: docgen.bench.evaluate.reward for every task (OCR text/box similarity, banking partial credit). Native MS-SWIFT 4.x options; paths and GPU IDs are launcher arguments.
model_type: qwen3_5
tuner_type: lora
torch_dtype: bfloat16
target_modules: all-linear
freeze_llm: false
freeze_vit: true
freeze_aligner: false
lora_rank: 32
lora_alpha: 64
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
num_train_epochs: 1
max_length: 16384
warmup_ratio: 0.05
logging_steps: 1
save_steps: 50
save_total_limit: 3
dataloader_num_workers: 2
dataset_num_proc: 4
split_dataset_ratio: 0
report_to: none
deepspeed: zero2
# LoRA (continues the SFT adapter)
learning_rate: 5.0e-6
beta: 0.04
rlhf_type: grpo
reward_funcs: ["docgen"]   # train/reward_plugin.py (launch.py adds it), reward = docgen.bench.evaluate.reward
remove_unused_columns: false
num_generations: 4
temperature: 1.0
top_p: 0.95
# Longest answers: OCR spotting (up to 40 boxes) and kie with up to 40 fields; cross_check and review are short.
max_completion_length: 1536
use_vllm: false
enable_thinking: false
log_completions: true
