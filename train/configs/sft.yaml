# SFT for OCR + document + banking tasks (train/mix.py samples). Native MS-SWIFT 4.x options;
# paths and GPU IDs are launcher arguments.
# Batch layout for 2 x A100 80GB: 1 sample per GPU x 2 GPUs x 4 accumulation = 8 per update.
# Samples hold up to 12000 image tokens (several documents) + question and answer, so one per GPU.
# A100 40GB: if it runs out of memory, deepspeed zero3, or lower data.max_image_tokens_per_sample
# (e.g. 8000) and prepare again into a new data.output_dir.
model_type: qwen3_5
tuner_type: lora
torch_dtype: bfloat16
target_modules: all-linear
freeze_llm: false
freeze_vit: false
freeze_aligner: false
lora_rank: 32
lora_alpha: 64
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
num_train_epochs: 1
# Must match data.sft_max_length (prepare drops samples that would not fit).
max_length: 16384
warmup_ratio: 0.05
logging_steps: 1
save_steps: 200
save_total_limit: 3
dataloader_num_workers: 4
dataset_num_proc: 4
split_dataset_ratio: 0
report_to: none
deepspeed: zero2
learning_rate: 1.0e-4
eval_steps: 200
per_device_eval_batch_size: 1
add_non_thinking_prefix: true
loss_scale: ignore_empty_think
