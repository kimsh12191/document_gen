<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Viewer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#677084;--line:#dfe3ea;--ok:#12a150;--bad:#e5383b;--part:#d98a00;--accent:#2563eb;--okbg:rgba(18,161,80,.12);--badbg:rgba(229,56,59,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1d2128;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2e3440}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Malgun Gothic",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:16px;margin:0}#status{color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:12px;padding:12px 16px}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);letter-spacing:.04em}h3{font-size:13px;margin:14px 0 6px}
label{display:block;margin:8px 0 3px;color:var(--muted);font-size:12px}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;font-size:13px}
button{margin-top:10px;padding:7px 12px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.5}button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row>*{flex:1}.hint{color:var(--muted);font-size:12px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{margin:0;flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#list{max-height:42vh;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px}
#list tr{cursor:pointer}#list tr.cur{background:rgba(37,99,235,.15)}#list tr:hover{background:rgba(37,99,235,.08)}
.dot{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:0 3px;font-size:11px;font-variant-numeric:tabular-nums}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.part{background:rgba(217,138,0,.14);color:var(--part)}.none{color:var(--muted)}
td.ok,td.bad{font-weight:500}
td.qid{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view table td:first-child,#view table th:first-child{white-space:nowrap}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.meta b{color:var(--ink);font-weight:600}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pages figure{margin:0;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);cursor:zoom-in}
.pages img{width:100%;display:block;border-radius:3px}.pages figcaption{font-size:11px;margin-top:4px;line-height:1.35}
.tag{display:inline-block;background:rgba(217,138,0,.16);color:var(--part);border-radius:4px;padding:0 4px;font-size:11px}
details{margin-top:8px}summary{cursor:pointer;color:var(--muted);font-size:12px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:300px;overflow:auto;font-size:12px;margin:6px 0}
.cell{white-space:pre-wrap;word-break:break-word}.err{color:var(--bad)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;overflow:auto;z-index:9;cursor:zoom-out;padding:24px}
#lightbox img{display:block;margin:0 auto;max-width:none;background:#fff}#lightbox div{color:#fff;text-align:center;margin-bottom:8px;font-size:13px}
.files div{font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line)}
</style></head><body>
<header><h1>Bank Viewer</h1><span id="status"></span></header>
<main>
<div>
<section>
<div class="tabs"><button id="tab-bench" class="on">벤치마크 보기</button><button id="tab-free">직접 테스트</button></div>

<div id="pane-bench">
<div class="row"><div><label>과제</label><select id="f-task"><option value="">전체</option></select></div>
<div><label>업무</label><select id="f-task_name"><option value="">전체</option></select></div></div>
<div id="f-cc" class="row"><div><label>대조: 불일치 분류</label><select id="f-category"><option value="">전체</option></select></div>
<div><label>대조: 변조 여부</label><select id="f-perturbed"><option value="">전체</option><option value="yes">변조 문항</option><option value="no">정상 문항</option></select></div></div>
<div id="f-cc2"><label>대조: 사례</label><select id="f-case"><option value="">전체</option></select></div>
<div id="f-rv"><label>심사 질의: 능력</label><select id="f-skill"><option value="">전체</option></select></div>
<div class="row"><div><label>모델</label><select id="f-model"><option value="">(거르지 않음)</option></select></div>
<div><label>그 모델이</label><select id="f-verdict"><option value="wrong">틀린 문제</option><option value="right">맞은 문제</option><option value="">전부</option></select></div></div>
<div class="row"><div><label>맞힌 모델</label><select id="f-better"><option value="">-</option></select></div>
<div><label>틀린 모델</label><select id="f-worse"><option value="">-</option></select></div></div>
<div class="hint">"맞힌 모델"과 "틀린 모델"을 고르면 앞 모델은 맞히고 뒤 모델은 틀린 문제만 봅니다 (학습으로 좋아진 문제·나빠진 문제).</div>
<label>문항 ID에 포함된 글자</label><input id="f-q" placeholder="예: mortgage, cross_check/jeonse">
<button id="go">목록 보기</button>
<div id="summary"></div>
<div id="list"></div>
<div class="row"><button class="ghost" id="prev">◀ 이전</button><button class="ghost" id="next">다음 ▶</button><button class="ghost" id="rand">무작위</button></div>
</div>

<div id="pane-free" hidden>
<label>서류 파일 (이미지·PDF, 여러 개 가능. 고른 순서대로 보냄)</label><input id="files" type="file" multiple accept="image/*,.pdf,application/pdf">
<div class="files" id="filelist"></div>
<label>과제</label><select id="free-task"></select>
<div id="o-customer"><label>고객 성명</label><input id="customer" placeholder="예: 홍길동"></div>
<div id="o-workflow"><label>업무 (목록에서 고르면 필수 서류가 채워짐, 직접 써도 됨)</label><input id="workflow" list="workflows" placeholder="예: 주택담보대출"><datalist id="workflows"></datalist></div>
<div id="o-required"><label>필수 서류 (한 줄에 하나)</label><textarea id="required"></textarea></div>
<div id="o-question"><label>심사 질문</label><textarea id="question">매매계약서의 매매대금 대비 대출신청서의 대출신청금액 비율(LTV)은 몇 %입니까? 소수점 첫째 자리까지 숫자만 답하세요.</textarea></div>
<div id="o-items"><label>뽑을 항목 (한 줄에 하나. "키: 항목명" 또는 항목명만)</label><textarea id="items">성명
주민등록번호
주소
발급일자</textarea></div>
<div id="o-prompt"><label>질문</label><textarea id="prompt"></textarea></div>
<div class="hint" id="free-hint"></div>
<button id="free-run">실행</button>
</div>
</section>
</div>

<div>
<section id="view"><div class="hint">왼쪽에서 목록을 열고 문항을 고르세요.</div></section>
</div>
</main>
<div id="lightbox"></div>
<script>
const $=id=>document.getElementById(id);let INFO=null,LIST=[],CUR=-1,ITEM=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pct=v=>v==null?'—':(v*100).toFixed(1);
function setStatus(t,err){$('status').textContent=t;$('status').className=err?'err':''}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
function cls(v){return v==null?'none':v>=0.999?'ok':v>0?'part':'bad'}
function dot(v){return '<span class="dot '+cls(v)+'">'+(v==null?'·':v>=0.999?'✓':v>0?v.toFixed(2):'✗')+'</span>'}
function val(v){if(v==null)return '<span class="none">null</span>';if(typeof v==='object')return esc(JSON.stringify(v));return esc(v)}

// ---- tabs ----
function tab(name){$('tab-bench').classList.toggle('on',name==='bench');$('tab-free').classList.toggle('on',name==='free');$('pane-bench').hidden=name!=='bench';$('pane-free').hidden=name!=='free'}
$('tab-bench').onclick=()=>tab('bench');$('tab-free').onclick=()=>tab('free');

// ---- benchmark ----
function filters(){const f={};['task','task_name','category','case','perturbed','skill','model','verdict','better','worse','q'].forEach(k=>f[k]=$('f-'+k).value);if(f.model==='')f.verdict='';
 if($('f-cc').hidden){f.category=f.case=f.perturbed=''}if($('f-rv').hidden)f.skill='';return f}
function filterUI(){const t=$('f-task').value;$('f-cc').hidden=$('f-cc2').hidden=!(t===''||t==='cross_check');$('f-rv').hidden=!(t===''||t==='review')}
$('f-task').onchange=filterUI;
$('go').onclick=async()=>{setStatus('목록 만드는 중...');try{const j=await post('/api/list',filters());LIST=j.rows;CUR=-1;
 const m=j.means.filter(x=>x.n);
 $('summary').innerHTML='<h3>'+j.n+'문항'+(j.rows.length<j.n?' (앞 '+j.rows.length+'개만 목록에)':'')+'</h3>'+(m.length?'<table><tr><th>모델</th><th class="num">평균 점수</th><th class="num">정답률</th><th class="num">문항</th></tr>'+m.map(x=>'<tr><td><b>'+(INFO.models.indexOf(x.label)+1)+'</b> '+esc(x.label)+'</td><td class="num">'+pct(x.reward)+'</td><td class="num">'+pct(x.right)+'</td><td class="num">'+x.n+'</td></tr>').join('')+'</table>':'');
 const head='<tr><th>문항</th>'+INFO.models.map((l,k)=>'<th class="num" title="'+esc(l)+'">'+(k+1)+'</th>').join('')+'</tr>';
 $('list').innerHTML='<table>'+head+LIST.map((r,i)=>'<tr data-i="'+i+'"><td class="qid" title="'+esc(r.id)+'">'+esc(r.id)+'</td>'+r.scores.map(s=>'<td>'+dot(s)+'</td>').join('')+'</tr>').join('')+'</table>';
 $('list').querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>open(+tr.dataset.i));setStatus('');
 if(LIST.length)open(0);else{$('list').innerHTML='';$('view').innerHTML='<div class="hint">조건에 맞는 문항이 없습니다. 위의 거르기 조건을 바꿔 보세요.</div>'}}catch(e){setStatus(e.message,1)}};
$('prev').onclick=()=>CUR>0&&open(CUR-1);$('next').onclick=()=>CUR<LIST.length-1&&open(CUR+1);$('rand').onclick=()=>LIST.length&&open(Math.floor(Math.random()*LIST.length));
async function open(i){CUR=i;$('list').querySelectorAll('tr.cur').forEach(t=>t.classList.remove('cur'));const tr=$('list').querySelector('tr[data-i="'+i+'"]');if(tr){tr.classList.add('cur');tr.scrollIntoView({block:'nearest'})}
 setStatus('불러오는 중...');try{ITEM=await post('/api/item',{id:LIST[i].id});showItem(ITEM);setStatus((i+1)+' / '+LIST.length)}catch(e){setStatus(e.message,1)}}

const DOC_KEYS=[['missing','빠진 서류'],['not_required','불필요 서류'],['not_customer','타인 서류']];
function ccCell(o){if(o==null)return '<span class="err">(JSON 아님)</span>';if(typeof o!=='object'||Array.isArray(o))return '<span class="err">(정해진 형식이 아님: '+esc(JSON.stringify(o)).slice(0,80)+')</span>';const c=o.consistent;
 let s=c===true?'문제 없음':c===false?'<b>문제 있음</b>':'consistent 없음';
 (o.issues||[]).forEach(x=>{if(x&&typeof x==='object')s+='<br>· '+esc(x.document||'?')+' / '+esc(x.field||'?')+': '+esc(x.value??'')+(x.expected!=null?' <span class="none">(원래 '+esc(x.expected)+')</span>':'')});return s}
function dcCell(o,k){if(o==null)return '<span class="err">(JSON 아님)</span>';if(typeof o!=='object'||Array.isArray(o))return '<span class="err">(정해진 형식이 아님)</span>';const v=o[k];if(v==null)return '<span class="none">없음</span>';return Array.isArray(v)?(v.length?v.map(esc).join('<br>'):'<span class="none">[]</span>'):esc(v)}
function compareTable(task,detail,cols){ // cols: [{label, score}]
 const H='<tr><th></th><th>정답</th>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr>';
 if(detail.kind==='fields'){return '<table><tr><th>항목</th><th>정답</th>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr>'+detail.rows.map(r=>'<tr><td>'+esc(r.key)+(r.label?'<div class="none">'+esc(r.label)+'</div>':'')+'</td><td class="cell">'+val(r.gold)+'</td>'+r.pred.map((p,i)=>'<td class="cell '+(r.ok[i]?'ok':'bad')+'">'+val(p)+'</td>').join('')+'</tr>').join('')+'</table>'}
 if(detail.kind==='json'&&task==='cross_check')return '<table>'+H+'<tr><td>판단</td><td class="cell">'+ccCell(detail.gold)+'</td>'+detail.pred.map((p,i)=>'<td class="cell '+cls(cols[i].score)+'">'+ccCell(p)+'</td>').join('')+'</tr></table>';
 if(detail.kind==='json')return '<table>'+H+DOC_KEYS.map(([k,n])=>'<tr><td>'+n+'</td><td class="cell">'+dcCell(detail.gold,k)+'</td>'+detail.pred.map((p,i)=>'<td class="cell '+cls(cols[i].score)+'">'+dcCell(p,k)+'</td>').join('')+'</tr>').join('')+'</table>';
 const g=Array.isArray(detail.gold)?detail.gold.join('\n'):detail.gold;
 return '<table>'+H+'<tr><td>답</td><td class="cell">'+val(g)+'</td>'+detail.pred.map((p,i)=>'<td class="cell '+cls(cols[i].score)+'">'+val(task==='ocr_page'&&p?p.slice(0,1500)+(p.length>1500?' …':''):p)+'</td>').join('')+'</tr></table>'}
function pagesHTML(imgs){return '<div class="pages">'+imgs.map((im,k)=>'<figure data-k="'+k+'"><img src="'+im.url+'" loading="lazy"><figcaption><b>'+esc(im.index)+'</b> '+esc(im.name)+(im.tag?' <span class="tag">'+esc(im.tag)+'</span>':'')+'</figcaption></figure>').join('')+'</div>'}
function bindPages(imgs){document.querySelectorAll('.pages figure').forEach(f=>f.onclick=()=>{const im=imgs[+f.dataset.k];const lb=$('lightbox');
 lb.innerHTML='<div>'+esc(im.index+' '+im.name)+(im.tag?' · '+esc(im.tag):'')+' · '+im.w+'×'+im.h+' px (모델이 본 크기) · 누르면 닫힘</div><img src="'+im.url+'" style="width:'+Math.max(im.w,900)+'px">';lb.style.display='block';lb.scrollTop=0})}
$('lightbox').onclick=()=>$('lightbox').style.display='none';document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').style.display='none';
 if($('pane-bench').hidden||document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});

function showItem(j){const m=j.meta||{};const metaBits=[['문항',j.id],['과제',j.task_title],['업무',m.task_name],['고객',m.customer],['서류',m.doc_name],['분류',m.category],['사례',m.case],
  ['변조',m.perturbed===undefined?null:(m.perturbed?'예':'아니오')],['능력',m.skill],['촬영',m.condition],['글씨',m.writing]].filter(x=>x[1]!=null&&x[1]!=='');
 const cols=j.answers.map(a=>({label:a.label,score:a.reward}));
 let h='<div class="meta">'+metaBits.map(([k,v])=>'<span>'+k+' <b>'+esc(v)+'</b></span>').join('')+'</div>';
 h+='<h3>모델별 점수 <span class="none" style="font-weight:400">(점수 = GRPO 보상과 같은 채점, 1이 정답 · 주 지표: '+esc(j.main_metric)+')</span></h3><table><tr><th>모델</th><th class="num">점수</th><th class="num">주 지표</th><th>형식</th></tr>'+
  j.answers.map(a=>'<tr><td>'+esc(a.label)+'</td><td class="num">'+dot(a.reward)+'</td><td class="num">'+(a.main==null?'—':(a.main*100).toFixed(1))+'</td><td>'+(a.output==null?'<span class="none">답 없음</span>':a.parse_fail?'<span class="err">파싱 실패</span>':'')+'</td></tr>').join('')+'</table>';
 if(INFO.endpoint)h+='<button class="ghost" id="ask">지금 모델 서버로 다시 풀기</button><div id="askout"></div>';
 h+='<h3>정답과 모델 답</h3>'+compareTable(j.task,j.detail,cols);
 h+='<h3>서류 이미지 <span class="none" style="font-weight:400">('+j.images.length+'장, 누르면 크게)</span></h3>'+pagesHTML(j.images);
 h+='<details><summary>질문 전문</summary><pre>'+esc(j.prompt)+'</pre></details>';
 h+='<details><summary>모델 원문 답</summary>'+j.answers.map(a=>'<div class="none">'+esc(a.label)+'</div><pre>'+esc(a.output??'(답 없음)')+'</pre>').join('')+'</details>';
 $('view').innerHTML=h;bindPages(j.images);
 if($('ask'))$('ask').onclick=async()=>{$('ask').disabled=true;setStatus('모델 실행 중...');const t=performance.now();try{const r=await post('/api/ask',{id:j.id});
  $('askout').innerHTML='<h3>지금 모델 서버 답 '+dot(r.reward)+(r.finish_reason==='length'?' <span class="err">⚠ 길이 제한에서 잘림</span>':'')+'</h3>'+compareTable(j.task,r.detail,[{label:'지금 모델',score:r.reward}])+'<details><summary>원문</summary><pre>'+esc(r.output)+'</pre></details>';
  setStatus('완료 '+((performance.now()-t)/1000).toFixed(1)+'s')}catch(e){setStatus(e.message,1)}finally{$('ask').disabled=false}}}

// ---- free test ----
const SHOW={doc_check:['customer','workflow','required'],cross_check:['customer','workflow'],review:['workflow','question'],kie:['items'],classify:[],ocr_page:[],custom:['prompt']};
const HINT={doc_check:'파일마다 첫 쪽만 보냅니다. 서류 하나 = 파일 하나로 올리세요.',cross_check:'서류 2~3건을 올리세요. 모든 쪽을 보냅니다.',review:'질문에 필요한 서류를 올리세요. 질문에 답 형식(숫자만, 예/아니오)을 적어 주면 좋습니다.',
 kie:'서류 한 건(파일 하나)만 올리세요.',classify:'서류 한 건(파일 하나)만 올리세요.',ocr_page:'서류 한 건(파일 하나)만 올리세요.',custom:'올린 모든 쪽과 질문을 그대로 보냅니다.'};
function freeUI(){const t=$('free-task').value;['customer','workflow','required','question','items','prompt'].forEach(k=>$('o-'+k).hidden=!SHOW[t].includes(k));$('free-hint').textContent=HINT[t]+' 한 번에 최대 '+INFO.budget.max_images+'장, 이미지는 학습 때와 같은 규칙으로 줄여서 보냅니다.'}
$('free-task').onchange=freeUI;
$('workflow').oninput=()=>{const w=(INFO.workflows.find(x=>x[0]===$('workflow').value)||[])[1];if(w)$('required').value=w.join('\n')};
$('files').onchange=()=>{$('filelist').innerHTML=[...$('files').files].map((f,i)=>'<div>'+(i+1)+'. '+esc(f.name)+' <span class="none">'+(f.size/1024).toFixed(0)+'KB</span></div>').join('')};
const readAll=()=>Promise.all([...$('files').files].map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:f.name,data:r.result});r.readAsDataURL(f)})));
$('free-run').onclick=async()=>{const t=$('free-task').value;$('free-run').disabled=true;setStatus('파일 읽는 중...');const t0=performance.now();
 try{const body={task:t,files:await readAll(),customer:$('customer').value,workflow:$('workflow').value,required:$('required').value,question:$('question').value,items:$('items').value,prompt:$('prompt').value};
  setStatus('모델 실행 중...');const r=await post('/api/free',body);showFree(r);setStatus('완료 '+((performance.now()-t0)/1000).toFixed(1)+'s')}catch(e){setStatus(e.message,1)}finally{$('free-run').disabled=false}};
function showFree(r){let h='<div class="meta"><span>직접 테스트 <b>'+esc((INFO.free_tasks.find(x=>x[0]===r.task)||[])[1])+'</b></span><span>이미지 <b>'+r.images.length+'장</b></span></div>';
 if(r.finish_reason==='length')h+='<div class="err">⚠ 답이 길이 제한에서 잘렸습니다</div>';
 h+='<h3>모델 답</h3>';const p=r.parsed;
 if(r.task==='cross_check')h+='<table><tr><td class="cell">'+ccCell(p)+'</td></tr></table>';
 else if(r.task==='doc_check')h+='<table>'+DOC_KEYS.map(([k,n])=>'<tr><td style="width:110px">'+n+'</td><td class="cell">'+dcCell(p,k)+'</td></tr>').join('')+'</table>';
 else if(r.task==='kie'&&p&&typeof p==='object')h+='<table><tr><th>항목</th><th>값</th></tr>'+Object.entries(p).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="cell">'+val(v)+'</td></tr>').join('')+'</table>';
 else h+='<pre>'+esc(r.output)+'</pre>';
 h+='<h3>보낸 이미지 <span class="none" style="font-weight:400">(누르면 크게)</span></h3>'+pagesHTML(r.images);
 h+='<details><summary>보낸 질문</summary><pre>'+esc(r.prompt)+'</pre></details><details><summary>모델 원문 답</summary><pre>'+esc(r.output)+'</pre></details>';
 $('view').innerHTML=h;bindPages(r.images)}

fetch('/api/info').then(r=>r.json()).then(i=>{INFO=i;
 setStatus((i.endpoint?'모델 서버 '+i.endpoint:'모델 서버 없음 (저장된 답만 보기, 직접 테스트 꺼짐)')+' · 모델 '+i.models.length+'개');
 i.tasks.forEach(([t,n,c])=>$('f-task').add(new Option(n+' ('+c+')',t)));
 i.task_names.forEach(v=>$('f-task_name').add(new Option(v,v)));i.categories.forEach(v=>$('f-category').add(new Option(v,v)));
 i.cases.forEach(v=>$('f-case').add(new Option(v,v)));i.skills.forEach(v=>$('f-skill').add(new Option(v,v)));
 i.models.forEach((m,k)=>{['f-model','f-better','f-worse'].forEach(s=>$(s).add(new Option(m,k)))});
 i.workflows.forEach(([w])=>{const o=document.createElement('option');o.value=w;$('workflows').appendChild(o)});
 i.free_tasks.forEach(([k,n])=>$('free-task').add(new Option(n,k)));freeUI();filterUI();
 if(!i.endpoint){$('free-run').disabled=true;$('tab-free').title='모델 서버와 함께 띄워야 씁니다'}
 if(!i.models.length)$('view').innerHTML='<div class="hint">저장된 모델 답이 아직 없습니다 (파이프라인 평가 전). 직접 테스트는 모델 서버와 함께 띄우면 됩니다.</div>'});
</script></body></html>
